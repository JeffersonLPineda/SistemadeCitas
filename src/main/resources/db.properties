# Configuracion de persistencia. Cada valor puede sobrescribirse con variable de entorno
# (DB_URL, DB_USER, DB_PASSWORD, APP_PERSISTENCIA, APP_DATOS_DEMO) o con -Ddb.url=... etc.
# Recomendado: definir DB_PASSWORD como variable de entorno y no escribirla aqui.

# postgresql  (persistente)   |   memoria  (sin base de datos, solo para pruebas rapidas)
app.persistencia=postgresql

# Carga usuarios/citas de demostracion solo si la base esta vacia
app.datos-demo=true

db.url=jdbc:postgresql://127.0.0.1:5433/gestion_citas?ssl=false
db.user=citas_app
db.password=root
